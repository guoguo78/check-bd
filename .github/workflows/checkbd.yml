name: 招标信息定时检索

on:
  schedule:
    - cron: '0 10 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  check-bd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 仓库代码
        uses: actions/checkout@v5          # ← 升级到 v5

      - name: 配置 Python 环境
        uses: actions/setup-python@v5      # ← 升级到 v5（之前是 v3）
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: 执行检索脚本
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python "indexqianlima+biying.py"
        continue-on-error: true    
